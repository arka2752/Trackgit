<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Developers - Trackgit</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    .highlight-win { color: var(--success-color); font-weight: bold; background: var(--success-bg); padding: 2px 6px; border-radius: 4px; }
    .highlight-loss { color: var(--text-secondary); }
    .compare-table { width: 100%; border-collapse: collapse; }
    .compare-table th, .compare-table td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border-color); }
    .compare-table th { color: var(--text-secondary); font-weight: 500; font-size: 0.875rem; text-transform: uppercase; }
    .compare-table td:first-child { text-align: right; font-weight: 500; color: var(--text-primary); width: 30%; }
    .compare-table td:nth-child(2), .compare-table td:nth-child(3) { width: 35%; }
  </style>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
</head>
<body>
  
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="fa-brands fa-github"></i>
        <span>Trackgit</span>
      </a>
      
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="compare.html" class="active">Compare</a>
        <a href="favorites.html">Favorites</a>
      </nav>
      
      <div class="header-actions">
        <div class="rate-limit-badge" id="rate-limit-display" title="GitHub API Rate Limit">
          <i class="fa-solid fa-bolt"></i> <span id="rate-limit-text">--/--</span>
        </div>
        <a href="settings.html" class="btn btn-outline" title="Settings"><i class="fa-solid fa-gear"></i></a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </header>
  
  <main class="main-content container">
    <div class="card" style="margin-bottom: var(--spacing-xl);">
      <h2 class="text-center" style="margin-bottom: var(--spacing-lg);">Compare Developers</h2>
      <form id="compare-form" style="display: flex; gap: var(--spacing-md); justify-content: center; align-items: flex-end; flex-wrap: wrap;">
        <div class="input-group" style="margin-bottom: 0;">
          <label class="input-label" for="user1">Developer 1</label>
          <input type="text" id="user1" class="input-control" placeholder="e.g. torvalds" required>
        </div>
        <div style="padding-bottom: 8px; font-weight: bold; color: var(--text-secondary);">VS</div>
        <div class="input-group" style="margin-bottom: 0;">
          <label class="input-label" for="user2">Developer 2</label>
          <input type="text" id="user2" class="input-control" placeholder="e.g. gaearon" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-bottom: 1px;">Compare</button>
      </form>
    </div>
    
    <div id="error-container" class="card hidden text-center" style="border-color: var(--danger-color); color: var(--danger-color); margin-bottom: var(--spacing-md);"></div>
    
    <div id="loading-container" class="hidden text-center" style="padding: 40px;">
      <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--accent-color);"></i>
      <p style="margin-top: 16px;">Fetching profiles & repositories...</p>
    </div>
    
    <div id="results-container" class="hidden animate-fade-in">
      <div class="card">
        <table class="compare-table">
          <thead>
            <tr>
              <th>Metric</th>
              <th id="th-user1">User 1</th>
              <th id="th-user2">User 2</th>
            </tr>
          </thead>
          <tbody id="compare-body">
            <!-- Data injected here -->
          </tbody>
        </table>
      </div>
      
      <!-- Visual Comparison Charts -->
      <div class="charts-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-lg); margin-top: var(--spacing-lg);">
        <div class="card" style="height: 350px; display: flex; flex-direction: column;">
          <h3 style="margin-bottom: 0;">Multi-dimensional Profile</h3>
          <div style="flex: 1; position: relative; min-height: 0; padding: 10px;">
            <canvas id="compare-radar-chart"></canvas>
          </div>
        </div>
        <div class="card" style="height: 350px; display: flex; flex-direction: column;">
          <h3 style="margin-bottom: 0;">Key Stats Comparison</h3>
          <div style="flex: 1; position: relative; min-height: 0; padding: 10px;">
            <canvas id="compare-bar-chart"></canvas>
          </div>
        </div>
      </div>
      
      <!-- Text Insights -->
      <div class="card" style="margin-top: var(--spacing-lg);">
        <h3 style="margin-bottom: var(--spacing-md);"><i class="fa-solid fa-lightbulb" style="color: #e3b341;"></i> Automated Insights</h3>
        <ul id="compare-insights" style="list-style-type: disc; margin-left: 20px; line-height: 1.8; color: var(--text-secondary);">
          <!-- injected -->
        </ul>
      </div>
    </div>
    
  </main>
  
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Trackgit</p>
    </div>
  </footer>
  
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  
  <script src="js/pages/compare.js"></script>

</body>
</html>
