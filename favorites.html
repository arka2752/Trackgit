<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - Trackgit</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
</head>
<body>
  
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="fa-brands fa-github"></i>
        <span>Trackgit</span>
      </a>
      
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="compare.html">Compare</a>
        <a href="favorites.html" class="active">Favorites</a>
      </nav>
      
      <div class="header-actions">
        <div class="rate-limit-badge" id="rate-limit-display" title="GitHub API Rate Limit">
          <i class="fa-solid fa-bolt"></i> <span id="rate-limit-text">--/--</span>
        </div>
        <a href="settings.html" class="btn btn-outline" title="Settings"><i class="fa-solid fa-gear"></i></a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </header>
  
  <main class="main-content container animate-fade-in">
    <div class="flex-between" style="margin-bottom: var(--spacing-lg);">
      <h2>Saved Developers</h2>
    </div>
    
    <div id="favorites-container" class="dev-grid">
      <!-- injected -->
    </div>
    
    <div id="no-favorites" class="card text-center hidden" style="padding: 40px;">
      <i class="fa-regular fa-folder-open fa-3x" style="color: var(--text-secondary); margin-bottom: 16px;"></i>
      <p style="font-size: 1.1rem; color: var(--text-secondary);">No favorite developers yet.</p>
      <a href="search.html" class="btn btn-primary" style="margin-top: 16px;">Search Developers</a>
    </div>
  </main>
  
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  
  <script src="js/pages/favorites.js"></script>

</body>
</html>
